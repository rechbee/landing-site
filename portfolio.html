<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio — RechBee Photograph. Ensaios femininos, famílias, pre wedding e civil day em São Paulo.">
  <title>Portfólio — RechBee Photograph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="portfolio">

  <header id="siteHeader"></header>

  <main>

    <section class="page-head container">
      <p class="label" data-i18n="page.portfolio.label">Portfólio</p>
      <h1 class="page-title">O <em>trabalho</em></h1>
      <p class="page-sub prose" data-i18n="page.portfolio.sub">Uma seleção de ensaios, fases e histórias que merecem permanecer.</p>
    </section>

    <section class="container">
      <ul class="filters" role="tablist" aria-label="Filtros">
        <li><button type="button" class="active" data-filter="all" data-i18n="filters.all">todos</button></li>
        <li><button type="button" data-filter="women" data-i18n="filters.women">feminino</button></li>
        <li><button type="button" data-filter="families" data-i18n="filters.families">família</button></li>
        <li><button type="button" data-filter="couples" data-i18n="filters.couples">casal</button></li>
        <li><button type="button" data-filter="civil" data-i18n="filters.civil">civil day</button></li>
      </ul>

      <div class="grid-portfolio">

        <figure class="work work--big reveal" data-cat="women">
          <div class="figure">
            <div class="visual visual--wide" aria-hidden="true"><span>FOTOGRAFIA — 01</span></div>
          </div>
          <span class="tag" data-i18n="tags.women">Feminino</span>
          <figcaption class="figcaption">O reconhecimento<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work work--mini reveal" data-cat="couples">
          <div class="figure">
            <div class="visual visual--portrait" aria-hidden="true"><span>FOTOGRAFIA — 02</span></div>
          </div>
          <span class="tag" data-i18n="tags.couples">Casal</span>
          <figcaption class="figcaption">A caminhada<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work work--mini reveal" data-cat="women">
          <div class="figure">
            <div class="visual visual--portrait" aria-hidden="true"><span>FOTOGRAFIA — 03</span></div>
          </div>
          <span class="tag" data-i18n="tags.women">Feminino</span>
          <figcaption class="figcaption">Janela<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work reveal" data-cat="families">
          <div class="figure">
            <div class="visual visual--sq" aria-hidden="true"><span>FOTOGRAFIA — 04</span></div>
          </div>
          <span class="tag" data-i18n="tags.families">Família</span>
          <figcaption class="figcaption">Fim de tarde em casa<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work reveal" data-cat="couples">
          <div class="figure">
            <div class="visual visual--sq" aria-hidden="true"><span>FOTOGRAFIA — 05</span></div>
          </div>
          <span class="tag" data-i18n="tags.couples">Casal</span>
          <figcaption class="figcaption">O vão<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work work--big reveal" data-cat="civil">
          <div class="figure">
            <div class="visual visual--wide" aria-hidden="true"><span>FOTOGRAFIA — 06</span></div>
          </div>
          <span class="tag" data-i18n="tags.civil">Civil Day</span>
          <figcaption class="figcaption">Antes da assinatura<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work reveal" data-cat="civil">
          <div class="figure">
            <div class="visual visual--portrait" aria-hidden="true"><span>FOTOGRAFIA — 07</span></div>
          </div>
          <span class="tag" data-i18n="tags.civil">Civil Day</span>
          <figcaption class="figcaption">As alianças<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work reveal" data-cat="families">
          <div class="figure">
            <div class="visual" aria-hidden="true"><span>FOTOGRAFIA — 08</span></div>
          </div>
          <span class="tag" data-i18n="tags.families">Família</span>
          <figcaption class="figcaption">A bagunça boa<small>São Paulo — 2025</small></figcaption>
        </figure>

        <figure class="work reveal" data-cat="women">
          <div class="figure">
            <div class="visual" aria-hidden="true"><span>FOTOGRAFIA — 09</span></div>
          </div>
          <span class="tag" data-i18n="tags.women">Feminino</span>
          <figcaption class="figcaption">Ela se reconhecendo<small>São Paulo — 2025</small></figcaption>
        </figure>

      </div>
    </section>

    <section class="section section--dark">
      <div class="container uni-msg reveal">
        <h2 class="serif" style="font-weight: 380; font-size: clamp(1.9rem, 5.4vw, 3.6rem);" data-i18n="home.cta.title">Vamos fotografar uma história?</h2>
        <p style="margin-top: 28px;"><a class="link-more" style="border-color: var(--bg); color: var(--bg);" href="contact.html" data-i18n="home.cta.link">escreva para nós</a></p>
      </div>
    </section>

  </main>

  <footer id="siteFooter"></footer>

  <script src="js/main.js"></script>
</body>
</html>
